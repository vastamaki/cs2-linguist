[package]
name = "linguist-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
gpu = ["whisper-rs/vulkan", "whisper-rs/raw-api"]

[dependencies]
linguist-core.workspace = true
serde_json.workspace = true
whisper-rs = "=0.16.0"
hound = "3.5"

[target.'cfg(windows)'.dependencies]
wasapi = "=0.24.0"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
